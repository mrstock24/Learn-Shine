
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Shine Reader</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green: #293b35;
  --green2: #405d50;
  --paper: #f3f1eb;
  --toolbar: #e6e3db;
  --text: #292820;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--paper);
  color: var(--text);
}

header {
  padding: 12px 24px;
  background: var(--green);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 11px 16px;
  background: var(--toolbar);
}

button, .file-label, select {
  padding: 10px 15px;
  border: 0;
  border-radius: 7px;
  background: var(--green2);
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover, .file-label:hover {
  background: var(--green);
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

select {
  border: 1px solid #ffffff40;
}

input[type=file] {
  display: none;
}

#status {
  text-align: center;
  padding: 9px;
  color: #777;
  font-size: 13px;
}

#reader-shell {
  min-height: calc(100vh - 145px);
  padding: 8px 75px 18px 18px;
}

#reader {
  width: 100%;
  min-height: calc(100vh - 190px);
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border-radius: 8px;
  padding: 12px;
  box-shadow: 0 2px 14px #00000012;
}

/* PDF reading area */
#pdf-view {
  display: none;
  width: 100%;
  min-height: calc(100vh - 220px);
  justify-content: center;
  align-items: center;
  gap: 14px;
}

#pdf-canvas,
#pdf-canvas-2 {
  display: block;
  height: auto;
  max-width: 100%;
  background: white;
}

#pdf-view.spread canvas {
  max-width: calc(50% - 7px);
}

/* EPUB reading area */
#epub-view {
  display: none;
  width: 100%;
  height: calc(100vh - 190px);
  min-height: 500px;
  overflow: hidden;
}

#welcome {
  text-align: center;
  margin: auto;
  padding: 80px 15px;
}

#bottom-toolbar {
  margin-top: 10px;
  border-radius: 8px;
}

#floating-controls {
  position: fixed;
  right: 16px;
  top: 45%;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 8px;
  border-radius: 12px;
  background: #293b35ee;
  box-shadow: 0 3px 15px #00000030;
}

#floating-controls button {
  width: 43px;
  height: 43px;
  padding: 0;
  font-size: 19px;
  border-radius: 8px;
}

footer {
  text-align: center;
  color: #888;
  padding: 14px;
  font-size: 12px;
}

body.dark {
  background: #202321;
  color: #eee;
}

body.dark .toolbar {
  background: #303632;
}

body.dark #reader {
  background: #292e2a;
}

body.dark #status {
  color: #bbb;
}

body.dark #welcome {
  color: #eee;
}

#reader-shell:fullscreen {
  background: var(--paper);
  overflow: auto;
  padding: 12px 75px 12px 12px;
}

body.dark #reader-shell:fullscreen {
  background: #202321;
}

#reader-shell:fullscreen #reader {
  min-height: calc(100vh - 170px);
}

@media (max-width: 700px) {
  #reader-shell {
    padding: 8px;
  }

  #reader {
    min-height: calc(100vh - 180px);
    padding: 6px;
  }

  #pdf-view.spread {
    gap: 4px;
  }

  #pdf-view.spread canvas {
    max-width: calc(50% - 2px);
  }

  #floating-controls {
    right: 6px;
    top: auto;
    bottom: 15px;
  }

  #floating-controls button {
    width: 38px;
    height: 38px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Learn Shine</h1>
  <span>Reading Room</span>
</header>

<div class="toolbar" id="top-toolbar">
  <label class="file-label" for="book-file">Open a book</label>
  <input type="file" id="book-file" accept=".pdf,.epub">

  <button id="previous-top">Previous</button>
  <button id="next-top">Next</button>
  <button id="smaller-top">A−</button>
  <button id="larger-top">A+</button>
  <button id="theme-top">Dark mode</button>
  <button id="fullscreen-top">Fullscreen</button>

  <select id="layout-mode" title="Page layout">
    <option value="single">Single Page</option>
    <option value="spread">Two-Page Spread</option>
  </select>
</div>

<div id="status">Choose a PDF or EPUB book to begin reading.</div>

<main id="reader-shell">
  <div id="reader">

    <div id="pdf-view">
      <canvas id="pdf-canvas"></canvas>
      <canvas id="pdf-canvas-2" style="display:none;"></canvas>
    </div>

    <div id="epub-view"></div>

    <div id="welcome">
      <h2>Welcome to Learn Shine</h2>
      <p>A quiet place to read, explore and learn.</p>
      <p>Open a PDF or EPUB book to get started.</p>
    </div>

  </div>

  <div class="toolbar" id="bottom-toolbar">
    <button id="previous-bottom">Previous</button>
    <button id="next-bottom">Next</button>
    <button id="smaller-bottom">A−</button>
    <button id="larger-bottom">A+</button>
    <button id="theme-bottom">Dark mode</button>
    <button id="fullscreen-bottom">Fullscreen</button>
  </div>
</main>

<div id="floating-controls">
  <button id="float-top" title="Scroll to top">↑</button>
  <button id="float-previous" title="Previous page">‹</button>
  <button id="float-next" title="Next page">›</button>
  <button id="float-fullscreen" title="Fullscreen">⛶</button>
</div>

<footer>Learn Shine · Read. Explore. Understand.</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("book-file");
const status = document.getElementById("status");
const pdfView = document.getElementById("pdf-view");
const epubView = document.getElementById("epub-view");
const welcome = document.getElementById("welcome");

const canvas = document.getElementById("pdf-canvas");
const ctx = canvas.getContext("2d");

const canvas2 = document.getElementById("pdf-canvas-2");
const ctx2 = canvas2.getContext("2d");

const reader = document.getElementById("reader");
const shell = document.getElementById("reader-shell");
const layoutSelect = document.getElementById("layout-mode");

let pdfDoc = null;
let pdfPage = 1;

let layoutMode = "single";

let epubBook = null;
let epubRendition = null;

let currentType = null;
let fontSize = 100;
let darkMode = false;

/* Show the correct reader */
function showReader() {
  welcome.style.display = "none";

  pdfView.style.display =
    currentType === "pdf" ? "flex" : "none";

  epubView.style.display =
    currentType === "epub" ? "block" : "none";
}

/* Work out how many PDF pages to move */
function getPDFStep() {
  return layoutMode === "spread" ? 2 : 1;
}

/* Update navigation buttons */
function updateButtons() {
  const previousDisabled =
    currentType === null ||
    (currentType === "pdf" && pdfPage <= 1);

  const nextDisabled =
    currentType === null ||
    (
      currentType === "pdf" &&
      pdfPage + getPDFStep() > pdfDoc.numPages
    );

  [
    "previous-top",
    "previous-bottom",
    "float-previous"
  ].forEach(id => {
    document.getElementById(id).disabled = previousDisabled;
  });

  [
    "next-top",
    "next-bottom",
    "float-next"
  ].forEach(id => {
    document.getElementById(id).disabled = nextDisabled;
  });
}

/* Render one PDF page onto a canvas */
async function drawPDFPage(pageNumber, targetCanvas, targetContext, scale) {
  const page = await pdfDoc.getPage(pageNumber);
  const viewport = page.getViewport({ scale });

  const pixelRatio = window.devicePixelRatio || 1;

  targetCanvas.width = Math.floor(viewport.width * pixelRatio);
  targetCanvas.height = Math.floor(viewport.height * pixelRatio);

  targetCanvas.style.width = viewport.width + "px";
  targetCanvas.style.height = viewport.height + "px";
  targetCanvas.style.display = "block";

  await page.render({
    canvasContext: targetContext,
    viewport: viewport,
    transform: pixelRatio !== 1
      ? [pixelRatio, 0, 0, pixelRatio, 0, 0]
      : null
  }).promise;
}

/* Render the current PDF page or two-page spread */
async function renderPDF() {
  if (!pdfDoc) return;

  const isSpread = layoutMode === "spread";

  pdfView.classList.toggle("spread", isSpread);

  canvas2.style.display = "none";

  const firstPage = await pdfDoc.getPage(pdfPage);
  const firstBase = firstPage.getViewport({ scale: 1 });

  const availableWidth = reader.clientWidth - 40;
  const availableHeight = window.innerHeight - 145;

  const pageCount = isSpread && pdfPage < pdfDoc.numPages ? 2 : 1;

  let widthPerPage = availableWidth;

  if (pageCount === 2) {
    widthPerPage = (availableWidth - 14) / 2;
  }

  let scale = Math.min(
    widthPerPage / firstBase.width,
    availableHeight / firstBase.height,
    2.5
  );

  /* Make sure the second page also fits */
  if (pageCount === 2) {
    const secondPage = await pdfDoc.getPage(pdfPage + 1);
    const secondBase = secondPage.getViewport({ scale: 1 });

    scale = Math.min(
      scale,
      widthPerPage / secondBase.width,
      availableHeight / secondBase.height
    );
  }

  scale = Math.max(0.1, scale);

  await drawPDFPage(pdfPage, canvas, ctx, scale);

  if (pageCount === 2) {
    canvas2.style.display = "block";
    await drawPDFPage(pdfPage + 1, canvas2, ctx2, scale);
  }

  status.textContent =
    "PDF · Page " + pdfPage +
    (pageCount === 2 ? "–" + (pdfPage + 1) : "") +
    " of " + pdfDoc.numPages;

  updateButtons();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* Open a PDF */
async function openPDF(data) {
  currentType = "pdf";
  epubBook = null;
  pdfDoc = await pdfjsLib.getDocument({ data }).promise;

  pdfPage = 1;

  showReader();
  await renderPDF();
}

/* Create or recreate the EPUB reader */
async function createEPUBRendition(startCfi) {
  if (epubRendition) {
    epubRendition.destroy();
  }

  epubView.innerHTML = "";

  epubRendition = epubBook.renderTo("epub-view", {
    width: "100%",
    height: "100%",
    flow: "paginated",
    spread: layoutMode === "spread" ? "always" : "none"
  });

  epubRendition.themes.fontSize(fontSize + "%");

  epubRendition.themes.register("dark", {
    body: {
      background: "#292e2a !important",
      color: "#eeeeee !important"
    }
  });

  epubRendition.themes.register("light", {
    body: {
      background: "#ffffff !important",
      color: "#292820 !important"
    }
  });

  epubRendition.themes.select(darkMode ? "dark" : "light");

  epubRendition.on("relocated", location => {
    const page = location.start.displayed.page || 1;
    const total = location.start.displayed.total || "?";

    status.textContent = "EPUB · " + page + " / " + total;
    updateButtons();
  });

  await epubRendition.display(startCfi || undefined);
}

/* Open an EPUB */
async function openEPUB(data) {
  currentType = "epub";
  pdfDoc = null;

  epubBook = ePub(data);

  showReader();

  await createEPUBRendition();

  updateButtons();
}

/* Change between single page and two-page spread */
async function changeLayout() {
  layoutMode = layoutSelect.value;

  if (currentType === "pdf" && pdfDoc) {
    await renderPDF();
  }

  if (currentType === "epub" && epubRendition) {
    const location = epubRendition.currentLocation();
    const startCfi = location && location.start
      ? location.start.cfi
      : null;

    await createEPUBRendition(startCfi);
  }
}

layoutSelect.addEventListener("change", changeLayout);

/* Previous page */
async function previousPage() {
  if (currentType === "pdf" && pdfPage > 1) {
    pdfPage = Math.max(1, pdfPage - getPDFStep());
    await renderPDF();
  } else if (currentType === "epub" && epubRendition) {
    await epubRendition.prev();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
}

/* Next page */
async function nextPage() {
  if (
    currentType === "pdf" &&
    pdfPage + getPDFStep() <= pdfDoc.numPages
  ) {
    pdfPage += getPDFStep();
    await renderPDF();
  } else if (currentType === "epub" && epubRendition) {
    await epubRendition.next();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
}

/* Change EPUB font size */
function changeFont(amount) {
  fontSize = Math.max(70, Math.min(200, fontSize + amount));

  if (epubRendition) {
    epubRendition.themes.fontSize(fontSize + "%");
  }
}

/* Toggle dark mode */
function toggleTheme() {
  darkMode = !darkMode;

  document.body.classList.toggle("dark", darkMode);

  const label = darkMode ? "Light mode" : "Dark mode";

  ["theme-top", "theme-bottom"].forEach(id => {
    document.getElementById(id).textContent = label;
  });

  if (epubRendition) {
    epubRendition.themes.select(darkMode ? "dark" : "light");
  }
}

/* Fullscreen */
async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await shell.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    status.textContent =
      "Fullscreen is not available in this browser.";
  }
}

function updateFullscreenLabels() {
  const label = document.fullscreenElement
    ? "Exit fullscreen"
    : "Fullscreen";

  ["fullscreen-top", "fullscreen-bottom"].forEach(id => {
    document.getElementById(id).textContent = label;
  });
}

document.addEventListener("fullscreenchange", updateFullscreenLabels);

/* Open a book selected from the computer */
fileInput.addEventListener("change", async event => {
  const file = event.target.files[0];

  if (!file) return;

  status.textContent = "Opening " + file.name + "...";

  try {
    const data = await file.arrayBuffer();

    if (file.name.toLowerCase().endsWith(".pdf")) {
      await openPDF(data);
    } else if (file.name.toLowerCase().endsWith(".epub")) {
      await openEPUB(data);
    } else {
      throw new Error("Please choose a PDF or EPUB file.");
    }
  } catch (error) {
    status.textContent =
      "Unable to open book: " + error.message;
  }
});

/* Connect navigation buttons */
[
  "previous-top",
  "previous-bottom",
  "float-previous"
].forEach(id => {
  document.getElementById(id).onclick = previousPage;
});

[
  "next-top",
  "next-bottom",
  "float-next"
].forEach(id => {
  document.getElementById(id).onclick = nextPage;
});

/* Connect font controls */
["larger-top", "larger-bottom"].forEach(id => {
  document.getElementById(id).onclick = () => changeFont(10);
});

["smaller-top", "smaller-bottom"].forEach(id => {
  document.getElementById(id).onclick = () => changeFont(-10);
});

/* Connect theme controls */
["theme-top", "theme-bottom"].forEach(id => {
  document.getElementById(id).onclick = toggleTheme;
});

/* Connect fullscreen controls */
[
  "fullscreen-top",
  "fullscreen-bottom",
  "float-fullscreen"
].forEach(id => {
  document.getElementById(id).onclick = toggleFullscreen;
});

/* Floating scroll-to-top button */
document.getElementById("float-top").onclick = () => {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
};

/* Keyboard shortcuts */
document.addEventListener("keydown", event => {
  if (
    event.target.matches("input, textarea, select") ||
    event.altKey ||
    event.ctrlKey ||
    event.metaKey
  ) return;

  if (event.key === "ArrowLeft") {
    event.preventDefault();
    previousPage();
  }

  if (event.key === "ArrowRight") {
    event.preventDefault();
    nextPage();
  }

  if (event.key === "+" || event.key === "=") {
    changeFont(10);
  }

  if (event.key === "-") {
    changeFont(-10);
  }

  if (event.key.toLowerCase() === "f") {
    toggleFullscreen();
  }
});

/* Automatically load a book passed in the URL */
(async () => {
  const params = new URLSearchParams(location.search);
  const bookURL = params.get("book");

  if (!bookURL) return;

  try {
    status.textContent = "Loading your book...";

    const response = await fetch(bookURL);

    if (!response.ok) {
      throw new Error("Could not fetch the book.");
    }

    const data = await response.arrayBuffer();
    const path = bookURL.toLowerCase().split("?")[0];

    if (path.endsWith(".pdf")) {
      await openPDF(data);
    } else if (path.endsWith(".epub")) {
      await openEPUB(data);
    } else {
      throw new Error("The book URL must end in .pdf or .epub.");
    }
  } catch (error) {
    status.textContent =
      "Unable to load book: " + error.message;
  }
})();

/* Refit the PDF when the browser window changes size */
window.addEventListener("resize", () => {
  if (currentType === "pdf" && pdfDoc) {
    renderPDF().catch(error => {
      status.textContent =
        "Unable to resize PDF: " + error.message;
    });
  }
});
</script>

</body>
</html>
