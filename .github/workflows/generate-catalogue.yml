name: Generate Book Catalogue

on:
  push:
    branches:
      - main
    paths:
      - 'books/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate catalogue
        run: python scripts/generate_catalogue.py

      - name: Save catalogue to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library.json
          git diff --cached --quiet || (git commit -m "Update book catalogue" && git push)
