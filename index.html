
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Shine - My Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #26352c;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      margin-bottom: 8px;
      color: #247447;
      font-size: 36px;
    }

    .subtitle {
      color: #68766c;
    }

    .library {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .book-card {
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }

    .book-cover {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e4eee5;
      border-radius: 8px;
      color: #247447;
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      padding: 12px;
    }

    .book-card h2 {
      margin-bottom: 6px;
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .format {
      color: #778078;
      font-size: 13px;
    }

    .open-button {
      display: block;
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      background: #247447;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .open-button:hover {
      background: #195b35;
    }

    .category-heading {
      margin: 32px 0 16px;
      color: #247447;
      font-size: 22px;
    }

    .status {
      color: #68766c;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>Learn Shine</h1>
      <p class="subtitle">Your personal reading space.</p>
    </header>

    <section>
      <h2>My Library</h2>

      <div class="library">

        <!-- EXISTING PDF BOOK -->
        <div class="book-card">
          <div class="book-cover">PDF</div>

          <h2>Fat Computer Science</h2>
          <p class="format">PDF · My Collection</p>

          <a class="open-button"
             href="reader.html?book=Fat%20Computer%20Science.pdf">
            Open Book
          </a>
        </div>

        <!-- EXISTING EPUB BOOK -->
        <div class="book-card">
          <div class="book-cover">EPUB</div>

          <h2>CISSP: 3 in 1</h2>
          <p class="format">EPUB · My Collection</p>

          <a class="open-button"
             href="reader.html?book=CISSP%2C%203%20in%201-%20Beginner%27s%20Guide%20to%20Learn%20the%20Realms%20of%20Security%20and%20Risk%20Management%20from%20A-Z%20using.epub">
            Open Book
          </a>
        </div>

      </div>

      <!-- AUTOMATIC BOOKS WILL APPEAR HERE -->
      <div id="automatic-books"></div>

      <p id="library-status" class="status">
        Loading your additional books...
      </p>

    </section>
  </main>

  <script>
    async function loadBooks() {
      const container = document.getElementById("automatic-books");
      const status = document.getElementById("library-status");

      try {
        const response = await fetch("library.json");

        if (!response.ok) {
          throw new Error("Could not load the book catalogue.");
        }

        const books = await response.json();

        if (!Array.isArray(books) || books.length === 0) {
          status.textContent = "No additional books found yet.";
          return;
        }

        status.textContent = "";

        books.forEach(book => {
          const extension = book.path.split(".").pop().toUpperCase();

          const card = document.createElement("div");
          card.className = "book-card";

          const cover = document.createElement("div");
          cover.className = "book-cover";
          cover.textContent = extension;

          const title = document.createElement("h2");
          title.textContent = book.title;

          const details = document.createElement("p");
          details.className = "format";
          details.textContent = extension + " · " + book.category;

          const link = document.createElement("a");
          link.className = "open-button";
          link.textContent = "Open Book";
          link.href = "reader.html?book=" + encodeURIComponent(book.path);

          card.appendChild(cover);
          card.appendChild(title);
          card.appendChild(details);
          card.appendChild(link);

          container.appendChild(card);
        });

      } catch (error) {
        status.textContent = "Unable to load additional books. Please try again later.";
        console.error(error);
      }
    }

    loadBooks();
  </script>

</body>
</html>
