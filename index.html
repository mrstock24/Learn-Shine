
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Reading Room</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f5f3ed;
      color: #292820;
      font-family: Georgia, serif;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    h1 { font-size: 42px; }
    .subtitle { color: #777; }
    .book {
      background: white;
      padding: 22px;
      margin: 18px 0;
      border-radius: 10px;
    }
    a { color: #526c59; }
  </style>
</head>
<body>
  <main>
    <h1>My Reading Room</h1>
    <p class="subtitle">A quiet place to read and learn.</p>

    <h2>My Library</h2>

    <div class="book">
      <h3>My First Book</h3>
      <p>Your reading journey starts here.</p>
      <p>More books coming soon.</p>
    </div>

    <p>Welcome to your personal reading space.</p>
  </main>
</body>
</html>
