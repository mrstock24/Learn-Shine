
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Shine - My Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #26352c;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      margin-bottom: 8px;
      color: #247447;
      font-size: 36px;
    }

    .subtitle {
      color: #68766c;
    }

    .book-card {
      max-width: 300px;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }

    .book-cover {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e4eee5;
      border-radius: 8px;
      color: #247447;
      font-size: 48px;
    }

    .book-card h2 {
      margin-bottom: 6px;
      font-size: 20px;
    }

    .format {
      color: #778078;
      font-size: 13px;
    }

    .open-button {
      display: block;
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      background: #247447;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .open-button:hover {
      background: #195b35;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Learn Shine</h1>
      <p class="subtitle">Your personal reading space.</p>
    </header>

    <section>
      <h2>My Library</h2>

      <div class="book-card">
        <div class="book-cover">📖</div>

        <h2>Fat Computer Science</h2>
        <p class="format">PDF · My Collection</p>

        <a class="open-button"
           id="openBook"
           href="#">
          Open Book
        </a>
      </div>
    </section>
  </main>

  <script>
    const bookUrl =
      "https://mrstock24.github.io/Learn-Shine/CISSP%2C%203%20in%201-%20Beginner%27s%20Guide%20to%20Learn%20the%20Realms%20of%20Security%20and%20Risk%20Management%20from%20A-Z%20using.epub?utm_source=chatgpt.com";

    const readerUrl =
      "reader.html?book=" + encodeURIComponent(bookUrl);

    document.getElementById("openBook").href = readerUrl;
  </script>
</body>
</html>
